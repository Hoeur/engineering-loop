name: engloop

services:
  postgres:
    image: postgres:16-alpine
    container_name: engloop-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-engloop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-engloop}
      POSTGRES_DB: ${POSTGRES_DB:-engloop}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - engloop_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-engloop} -d ${POSTGRES_DB:-engloop}']
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [engloop]

  redis:
    image: redis:7-alpine
    container_name: engloop-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - engloop_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [engloop]

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    container_name: engloop-api
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-engloop}:${POSTGRES_PASSWORD:-engloop}@postgres:5432/${POSTGRES_DB:-engloop}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_URL: redis://redis:6379
      API_PORT: 4000
      API_CORS_ORIGINS: http://localhost:3000
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-change-me-in-production-please-32-chars-min}
      SECRETS_ENCRYPTION_KEY: ${SECRETS_ENCRYPTION_KEY:-Y2hhbmdlLW1lLTMyLWJ5dGUta2V5LWZvci1kZXYtb25seQ==}
      AGENT_DEFAULT_PROVIDER: ${AGENT_DEFAULT_PROVIDER:-mock}
      WORKSPACE_ROOT: /workspace
    ports:
      - '4000:4000'
    volumes:
      - engloop_workspace:/workspace
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://127.0.0.1:4000/api/health/live',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks: [engloop]

  worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    container_name: engloop-worker
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-engloop}:${POSTGRES_PASSWORD:-engloop}@postgres:5432/${POSTGRES_DB:-engloop}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_URL: redis://redis:6379
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-4}
      WORKER_HEALTH_PORT: 4100
      SECRETS_ENCRYPTION_KEY: ${SECRETS_ENCRYPTION_KEY:-Y2hhbmdlLW1lLTMyLWJ5dGUta2V5LWZvci1kZXYtb25seQ==}
      AGENT_DEFAULT_PROVIDER: ${AGENT_DEFAULT_PROVIDER:-mock}
      WORKSPACE_ROOT: /workspace
    ports:
      - '4100:4100'
    volumes:
      - engloop_workspace:/workspace
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://127.0.0.1:4100/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks: [engloop]

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000/api
    container_name: engloop-web
    restart: unless-stopped
    depends_on:
      api: { condition: service_healthy }
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: http://localhost:4000/api
      INTERNAL_API_URL: http://api:4000/api
    ports:
      - '3000:3000'
    networks: [engloop]

volumes:
  engloop_postgres_data:
  engloop_redis_data:
  engloop_workspace:

networks:
  engloop:
    driver: bridge
