name: E2E

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1'

env:
  DATABASE_URL: postgresql://engloop:engloop@localhost:5432/engloop?schema=public
  AUTH_JWT_SECRET: ci-secret-that-is-long-enough-for-validation
  SECRETS_ENCRYPTION_KEY: ci-secret-that-is-long-enough-for-validation
  NEXT_TELEMETRY_DISABLED: '1'
  # Inlined into the web build so the browser calls the API job step below
  # instead of a relative `/api` the Next server does not serve.
  NEXT_PUBLIC_API_URL: http://localhost:4000/api
  E2E_API_URL: http://localhost:4000/api

jobs:
  playwright:
    name: Responsive end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: engloop
          POSTGRES_PASSWORD: engloop
          POSTGRES_DB: engloop
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U engloop"
          --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 12

    steps:
      - uses: actions/checkout@v4
      # Version comes from packageManager in package.json; setting it here too
      # fails the action with "Multiple versions of pnpm specified".
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }

      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm build:packages
      - run: pnpm db:deploy
      - run: pnpm db:seed
      - run: pnpm --filter @engloop/api run build
      - run: pnpm --filter @engloop/web run build

      - name: Install Playwright browsers
        run: pnpm --filter @engloop/web exec playwright install --with-deps chromium

      - name: Start the API
        run: pnpm --filter @engloop/api run start &

      - name: Run Playwright
        run: pnpm test:e2e

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
